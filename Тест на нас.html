<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тест на нас</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700;900&display=swap">
<style>
/* Layout: один билет на экран, сверху шкала любви. Тест идёт как стопка кинобилетов с перфорацией. */
:root {
  --bg: #FFF0F2;
  --surface: #FFFFFF;
  --fg: #2B1020;
  --muted: #7E5F6C;
  --accent: #D91E58;
  --accent-ink: #FFFFFF;
  --sun: #FFC736;
  --sun-ink: #2B1020;
  --line: #F2CCD6;
  --font-display: 'Unbounded', 'Arial Black', 'Helvetica Neue', sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B0D18; --surface: #2A1626; --fg: #FFE8EE; --muted: #C9A3B2;
    --accent: #FF5E8F; --accent-ink: #2B0A18; --sun: #FFD25A; --sun-ink: #2B1020; --line: #4B2B40;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B0D18; --surface: #2A1626; --fg: #FFE8EE; --muted: #C9A3B2;
  --accent: #FF5E8F; --accent-ink: #2B0A18; --sun: #FFD25A; --sun-ink: #2B1020; --line: #4B2B40;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  max-width: 600px;
  margin: 0 auto;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Шкала любви */
.meter { display: grid; gap: 8px; margin-bottom: 22px; }
.meter-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.meter-label { font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.meter-pct { font-family: var(--font-display); font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; }
.track { height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; }
.fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--sun)); transition: width .7s cubic-bezier(.2,.8,.2,1); }

/* Билет */
.ticket {
  position: relative;
  overflow: hidden;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 20px 22px 24px;
  margin-bottom: 18px;
}
.ticket.enter { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.stub {
  position: relative;
  display: flex; justify-content: space-between; gap: 12px;
  padding-bottom: 14px;
  margin-bottom: 18px;
  border-bottom: 2px dashed var(--line);
  font-weight: 800; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.stub::before, .stub::after {
  content: ""; position: absolute; bottom: -12px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--bg); border: 1.5px solid var(--line);
}
.stub::before { left: -35px; }
.stub::after { right: -35px; }

.q { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 5.4vw, 25px); line-height: 1.25; margin: 0; text-wrap: balance; }
.q.big { font-size: clamp(24px, 7vw, 34px); font-weight: 900; }
.eyebrow { margin: 0 0 8px; font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.hint { margin: 12px 0 0; color: var(--muted); font-weight: 600; }
.lead { margin: 16px 0 22px; font-size: 17px; max-width: 46ch; }

/* Интро */
.hero h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(44px, 14vw, 68px); line-height: 1; margin: 18px 0 0; letter-spacing: -.02em; }
.mark { color: var(--accent); background: linear-gradient(transparent 64%, var(--sun) 64%); }
.seal { display: inline-block; transform: rotate(-4deg); border: 2px solid var(--accent); color: var(--accent); padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
.field { display: block; font-weight: 800; font-size: 13px; margin-bottom: 8px; }
input[type="text"] {
  width: 100%; padding: 13px 14px; margin-bottom: 16px;
  border: 1.5px solid var(--line); border-radius: 12px;
  background: transparent; color: var(--fg); font: 600 16px var(--font-body);
}
input[type="text"]::placeholder { color: var(--muted); opacity: .8; }

/* Кнопки */
.btn {
  display: inline-block; cursor: pointer;
  padding: 14px 22px; border-radius: 12px; border: 2px solid transparent;
  font: 800 16px var(--font-body);
  transition: transform .15s, background .15s, opacity .15s;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
#next, #again { margin-top: 16px; }

/* Варианты ответа */
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt {
  display: flex; gap: 12px; align-items: center; width: 100%;
  padding: 13px 14px; border-radius: 12px; text-align: left;
  border: 1.5px solid var(--line); background: transparent; color: var(--fg);
  font: 600 16px/1.35 var(--font-body); cursor: pointer;
  transition: transform .15s, border-color .15s, background .15s;
}
.opt .key { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--line); font-weight: 800; font-size: 12px; }
.opt span:last-child { min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(3px); }
.opt.picked { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.picked .key { background: var(--accent-ink); color: var(--accent); }
.opt:disabled:not(.picked) { opacity: .45; cursor: default; }
.react { margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--sun); color: var(--sun-ink); font-weight: 700; animation: rise .35s both; }

/* Ползунок */
.bignum { font-family: var(--font-display); font-weight: 900; font-size: 56px; line-height: 1; margin: 22px 0 18px; font-variant-numeric: tabular-nums; color: var(--accent); }
input[type="range"] {
  -webkit-appearance: none; appearance: none; display: block;
  width: 100%; height: 14px; border-radius: 99px; margin: 0; cursor: pointer;
  background: linear-gradient(90deg, var(--accent) var(--p, 50%), var(--line) var(--p, 50%));
}
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: var(--sun); border: 3px solid var(--accent); }
input[type="range"]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--sun); border: 3px solid var(--accent); }

/* Убегающая кнопка */
.duel { position: relative; min-height: 230px; margin-top: 18px; }
.duel .yes { position: absolute; left: 0; top: 0; z-index: 2; transform-origin: top left; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.duel .no { position: absolute; z-index: 1; transition: left .25s ease, top .25s ease; touch-action: none; white-space: nowrap; }

/* Мини-игра */
.stats { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.arena { position: relative; height: 280px; margin-top: 12px; border: 2px dashed var(--line); border-radius: 14px; overflow: hidden; touch-action: manipulation; }
.arena .startbtn { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.arena .startbtn:hover:not(:disabled) { transform: translate(-50%, calc(-50% - 2px)); }
.h { position: absolute; width: 44px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; animation: pop .25s both; }
.h svg { width: 100%; height: 100%; display: block; fill: currentColor; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Карты судьбы */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.flip { perspective: 700px; height: 160px; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
.flip:disabled { cursor: default; }
.flip-in { position: relative; display: block; width: 100%; height: 100%; transition: transform .7s; transform-style: preserve-3d; }
.flip.open .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; display: grid; place-items: center; padding: 10px; text-align: center; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.front { background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 900; font-size: 38px; }
.back { transform: rotateY(180deg); background: var(--sun); color: var(--sun-ink); font-weight: 800; font-size: 13px; line-height: 1.3; border: 2px dashed var(--sun-ink); }
.flip.dim .back { background: var(--surface); color: var(--muted); border-color: var(--line); }

/* Подсчёт */
.dots { display: flex; gap: 8px; margin-top: 18px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); animation: bounce 1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; background: var(--sun); }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* Результат */
.desc { margin: 12px 0 0; font-size: 17px; max-width: 48ch; }
.meters { display: grid; gap: 14px; margin-top: 22px; }
.mrow { display: grid; gap: 6px; }
.mrow-top { display: flex; justify-content: space-between; gap: 12px; font-weight: 800; font-size: 14px; }
.mrow-top b { font-variant-numeric: tabular-nums; }
.mfill { height: 100%; width: 0; border-radius: 99px; background: var(--accent); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
.mrow:nth-child(2) .mfill { background: var(--sun); }
.total { margin: 18px 0 0; padding: 12px 14px; border-radius: 12px; border: 1.5px dashed var(--accent); font-weight: 700; }
.coupon { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-top: 10px; padding: 12px 14px; border: 1.5px dashed var(--accent); border-radius: 12px; }
.coupon .ct { min-width: 0; font-weight: 700; }
.coupon .btn { flex: none; padding: 10px 14px; font-size: 14px; }
.coupon.used { border-style: solid; border-color: var(--line); }
.coupon.used .ct { color: var(--muted); text-decoration: line-through; }

/* Финал */
.letter p { margin: 0 0 12px; font-size: 17px; max-width: 48ch; }
.secret { margin-top: 18px; padding: 14px; border-radius: 12px; background: var(--sun); color: var(--sun-ink); }
.secret b { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.secret p { margin: 6px 0 0; font-weight: 700; }
.foot { margin-top: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

@media (max-width: 420px) {
  .ticket { padding: 18px 18px 22px; }
  .stub::before { left: -31px; }
  .stub::after { right: -31px; }
  .cards { gap: 8px; }
  .back { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<main class="wrap">
  <header class="meter" aria-label="Шкала любви">
    <div class="meter-top">
      <span class="meter-label">Шкала любви</span>
      <span class="meter-pct" id="pct">0%</span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </header>
  <div id="stage"></div>
  <p class="foot">Сделано одним человеком для одного человека.</p>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function () {
  /* Здесь можно поменять тексты, купоны и письмо на свои. */
  var CONFIG = {
    coupons: [
      'Массаж плеч, 15 минут без пауз',
      'Ты выбираешь фильм, я не спорю',
      'Посуда вечером на мне'
    ],
    prizes: [
      { short: 'Обнимашки без лимита', full: 'Обнимашки без лимита, действуют всегда' },
      { short: 'Ужин по твоему выбору', full: 'Ужин в любом месте, которое выберешь ты' },
      { short: 'Любое желание', full: 'Одно любое желание (в разумных пределах)' }
    ],
    finalQuestion: 'Пойдёшь со мной на свидание в эти выходные?',
    letter: [
      'Я сделал этот тест, потому что обычных слов мне мало.',
      'С тобой даже скучные дела превращаются в хорошие воспоминания. Спасибо, что ты рядом, {name}.',
      'Это самый удачный ответ в моей жизни.'
    ],
    secretLine: 'Ты поймала все сердечки. Значит, моё тоже у тебя.'
  };

  var QUESTIONS = [
    { type: 'choice', tag: 'Первое впечатление', q: 'Я пишу тебе: «Нам надо поговорить». Что ты делаешь?',
      opts: [['Придумываю сорок сценариев за минуту', 'b'], ['Отвечаю: «Ты принёс еду?»', 'c'], ['Пишу «рассказывай» и достаю плед', 'a']],
      react: 'Записал. На самом деле я просто хотел сказать, что ты классная.' },
    { type: 'choice', tag: 'Вопрос с подвохом', q: 'Кто в этой паре красивее?',
      opts: [['Ты', 'a'], ['Ты', 'a'], ['Определённо ты', 'a'], ['Все варианты верны', 'a']],
      react: 'Ответ засчитан. Он единственный верный.' },
    { type: 'slider', tag: 'Измерение чувств', q: 'Насколько сильно ты меня любишь?' },
    { type: 'duel', tag: 'Контрольный вопрос', q: 'Ты меня любишь?', yes: 'Да',
      nos: ['Нет', 'Точно нет?', 'Ты уверена?', 'Не нажимается', 'Поймай меня', 'Я просто кнопка', 'Ну пожалуйста', 'Я устала'],
      cap: 'Выбор невелик.', gone: 'Кнопка «Нет» уволилась. Ей не место в наших отношениях.',
      react: 'Так и знал. Ответ сохранён навсегда.' },
    { type: 'choice', tag: 'Суперсилы', q: 'Какая у нас суперсила как у пары?',
      opts: [['Находить еду в два часа ночи', 'c'], ['Понимать друг друга без слов', 'a'], ['Превращать любую поездку в приключение', 'b'], ['Смеяться над тем, что больше никому не смешно', 'c']],
      react: 'Согласен. Нас лучше не недооценивать.' },
    { type: 'game', tag: 'Мини-игра' },
    { type: 'choice', tag: 'Планы', q: 'Идеальная пятница у нас такая:',
      opts: [['Плед, кино и еда с доставкой', 'a'], ['Сесть в машину и ехать куда глаза глядят', 'b'], ['Мемы до утра и «ещё одна серия»', 'c'], ['Готовим вместе и немного поджигаем кухню', 'b']],
      react: 'Отличный план. Мы его реально сделаем.' },
    { type: 'choice', tag: 'Экстрим', q: 'Зомби-апокалипсис. Кто кого спасает?',
      opts: [['Я тебя, конечно', 'b'], ['Ты меня, а я держу фонарик', 'c'], ['По очереди, чтобы никому не обидно', 'a'], ['Открываем магазин сладостей на руинах', 'c']],
      react: 'С тобой я бы выжил. Или хотя бы вкусно поел.' },
    { type: 'cards', tag: 'Судьба' }
  ];
  var N = QUESTIONS.length;

  var TYPES = {
    a: { title: 'Два кота на одном диване', desc: 'Вы команда уюта. Плед, чай, тихая сила и одно на двоих «давай ещё пять минут».' },
    b: { title: 'Бонни и Клайд, но без преступлений', desc: 'Вы команда приключений. Любая дорога вдвоём становится сюжетом, а «давай поедем» всегда побеждает «давай останемся».' },
    c: { title: 'Шрек и Фиона: любовь без фильтров', desc: 'Вы команда юмора и еды. Вам не нужно выглядеть идеально, чтобы быть идеальными друг для друга.' }
  };

  var HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var stage = document.getElementById('stage');
  var fill = document.getElementById('fill');
  var pct = document.getElementById('pct');
  var state = {};

  function reset() { state = { tally: { a: 0, b: 0, c: 0 }, name: '', hearts: 0, secret: false, prize: null }; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nm() { return state.name || 'солнце'; }
  function fillName(t) { return t.replace('{name}', nm()); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function $(id) { return document.getElementById(id); }
  function setProgress(p) { fill.style.width = p + '%'; pct.textContent = Math.round(p) + '%'; }
  function ticket(tag, left, right, inner) {
    return '<section class="ticket enter"><div class="stub"><span>' + esc(left) + ' · ' + esc(tag) + '</span><span>' + esc(right) + '</span></div>' + inner + '</section>';
  }
  function qTicket(i, inner) { var q = QUESTIONS[i]; return ticket(q.tag, 'Билет №' + pad(i + 1), (i + 1) + '/' + N, inner); }
  function mount(html) { stage.innerHTML = html; try { window.scrollTo(0, 0); } catch (e) {} }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function after(i, text) {
    $('after').innerHTML = '<p class="react">' + esc(fillName(text)) + '</p><button class="btn primary" id="next">' + (i === N - 1 ? 'Узнать результат' : 'Дальше') + '</button>';
    $('next').onclick = function () { finish(i); };
    $('next').focus({ preventScroll: true });
  }
  function finish(i) { setProgress(Math.round((i + 1) / N * 90)); showStep(i + 1); }

  /* Интро */
  function intro() {
    reset(); setProgress(0);
    mount('<section class="ticket enter hero">' +
      '<span class="seal">Проверено любовью</span>' +
      '<h1>Тест<br>на <span class="mark">нас</span></h1>' +
      '<p class="lead">9 вопросов, одна мини-игра и подарки в конце. Отвечай как хочешь: система уже знает правильные ответы.</p>' +
      '<label class="field" for="name">Как тебя зовут?</label>' +
      '<input id="name" type="text" autocomplete="off" maxlength="24" placeholder="Напиши имя">' +
      '<button class="btn primary" id="start">Начать тест</button></section>');
    var input = $('name');
    $('start').onclick = function () { state.name = input.value.trim(); showStep(0); };
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') $('start').click(); });
  }

  function showStep(i) {
    if (i >= N) { calc(); return; }
    var q = QUESTIONS[i];
    if (q.type === 'choice') renderChoice(i, q);
    else if (q.type === 'slider') renderSlider(i, q);
    else if (q.type === 'duel') renderDuel(i, q);
    else if (q.type === 'game') renderGame(i, q);
    else renderCards(i, q);
  }

  function renderChoice(i, q) {
    var keys = ['А', 'Б', 'В', 'Г'];
    mount(qTicket(i, '<h2 class="q">' + esc(q.q) + '</h2><div class="opts">' +
      q.opts.map(function (o, k) { return '<button class="opt" data-k="' + k + '"><span class="key">' + keys[k] + '</span><span>' + esc(o[0]) + '</span></button>'; }).join('') +
      '</div><div id="after"></div>'));
    var btns = Array.prototype.slice.call(stage.querySelectorAll('.opt'));
    btns.forEach(function (b) {
      b.onclick = function () {
        btns.forEach(function (x) { x.disabled = true; });
        b.classList.add('picked');
        state.tally[q.opts[+b.dataset.k][1]]++;
        after(i, q.react);
      };
    });
  }

  function renderSlider(i, q) {
    mount(qTicket(i, '<h2 class="q">' + esc(q.q) + '</h2><div class="bignum" id="val">50%</div>' +
      '<input id="love" type="range" min="0" max="100" value="50" aria-label="Уровень любви">' +
      '<p class="hint" id="msg"></p><div id="after"><button class="btn primary" id="next" disabled>Дальше</button></div>'));
    var r = $('love'), val = $('val'), msg = $('msg'), next = $('next');
    var lines = [[30, 'Ты шутишь. Попробуй ещё раз.'], [70, 'Скромно. Меньше 100 система не принимает.'], [99, 'Уже ближе. Ещё чуть-чуть.'], [100, 'До луны и обратно. Принято.']];
    function upd() {
      var v = +r.value;
      r.style.setProperty('--p', v + '%');
      val.textContent = v + '%';
      msg.textContent = lines.filter(function (l) { return v <= l[0]; })[0][1];
      next.disabled = v < 100;
    }
    r.addEventListener('input', upd);
    next.onclick = function () { finish(i); };
    upd();
  }

  /* Убегающая кнопка «Нет» */
  function duel(o) {
    var html = '<h2 class="q">' + esc(o.q) + '</h2><div class="duel" id="duel">' +
      '<button class="btn primary yes" id="yes">' + esc(o.yes) + '</button>' +
      '<button class="btn ghost no" id="no">' + esc(o.nos[0]) + '</button></div>' +
      '<p class="hint" id="cap" aria-live="polite">' + esc(o.cap) + '</p><div id="after"></div>';
    mount(o.html(html));
    var box = $('duel'), yes = $('yes'), no = $('no'), cap = $('cap'), n = 0;
    no.style.left = '58%'; no.style.top = '8px';
    function dodge() {
      n++;
      if (n >= 9) {
        no.hidden = true; cap.textContent = o.gone;
        yes.style.transform = 'scale(1.6)';
        return;
      }
      no.textContent = o.nos[Math.min(n, o.nos.length - 1)];
      yes.style.transform = 'scale(' + Math.min(1 + 0.09 * n, 1.7) + ')';
      var W = box.clientWidth, H = box.clientHeight, bw = no.offsetWidth, bh = no.offsetHeight;
      no.style.left = Math.max(0, Math.random() * (W - bw)) + 'px';
      no.style.top = Math.max(0, Math.random() * (H - bh)) + 'px';
    }
    no.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') dodge(); });
    no.addEventListener('pointerdown', function (e) { e.preventDefault(); dodge(); });
    no.addEventListener('click', function (e) { e.preventDefault(); if (e.detail === 0) dodge(); });
    yes.onclick = function () { o.onYes({ yes: yes, no: no, cap: cap }); };
  }

  function renderDuel(i, q) {
    duel({
      q: q.q, yes: q.yes, nos: q.nos, cap: q.cap, gone: q.gone,
      html: function (inner) { return qTicket(i, inner); },
      onYes: function (el) {
        el.yes.disabled = true; el.no.hidden = true; el.cap.textContent = '';
        after(i, q.react);
      }
    });
  }

  /* Мини-игра */
  function renderGame(i, q) {
    var GOAL = 7, TIME = 12;
    mount(qTicket(i, '<h2 class="q">Поймай сердечки</h2>' +
      '<p class="hint">Нужно ' + GOAL + ' за ' + TIME + ' секунд. Нажимай на них, пока не улетели.</p>' +
      '<div class="stats"><span>Поймано: <b id="got">0</b> из ' + GOAL + '</span><span>Время: <b id="left">' + TIME + '</b></span></div>' +
      '<div class="arena" id="arena"><button class="btn primary startbtn" id="go">Поехали</button></div><div id="after"></div>'));
    var arena = $('arena'), gotEl = $('got'), leftEl = $('left'), go = $('go');
    var got = 0, left = TIME, spawn, tick, over = false;
    function addHeart() {
      var b = document.createElement('button');
      b.className = 'h'; b.setAttribute('aria-label', 'Сердечко'); b.innerHTML = HEART;
      b.style.left = Math.random() * (arena.clientWidth - 44) + 'px';
      b.style.top = Math.random() * (arena.clientHeight - 44) + 'px';
      b.style.color = Math.random() < 0.35 ? 'var(--sun)' : 'var(--accent)';
      function hit(e) {
        e.preventDefault();
        if (over || b.dataset.x) return;
        b.dataset.x = '1'; got++; gotEl.textContent = got; b.remove();
        if (got >= GOAL) end();
      }
      b.addEventListener('pointerdown', hit);
      b.addEventListener('click', hit);
      arena.appendChild(b);
      setTimeout(function () { b.remove(); }, 1500);
    }
    function end() {
      if (over) return;
      over = true; clearInterval(spawn); clearInterval(tick);
      Array.prototype.forEach.call(arena.querySelectorAll('.h'), function (h) { h.remove(); });
      state.hearts = got; state.secret = got >= GOAL;
      after(i, got >= GOAL ? 'Все семь. Ты поймала моё сердце ещё и официально.' : 'Поймано ' + got + ' из ' + GOAL + '. Остальные я отдам просто так.');
    }
    go.onclick = function () {
      go.hidden = true;
      addHeart();
      spawn = setInterval(addHeart, 520);
      tick = setInterval(function () { left--; leftEl.textContent = left; if (left <= 0) end(); }, 1000);
    };
  }

  /* Карты судьбы */
  function renderCards(i, q) {
    var order = shuffle([0, 1, 2]);
    mount(qTicket(i, '<h2 class="q">Выбери карту судьбы</h2>' +
      '<p class="hint">Одна карта твоя. Остальные покажу, чтобы ты знала, что могла выбрать.</p><div class="cards">' +
      order.map(function (p, k) {
        return '<button class="flip" data-k="' + k + '" aria-label="Карта ' + (k + 1) + '"><span class="flip-in"><span class="face front">?</span><span class="face back">' + esc(CONFIG.prizes[p].short) + '</span></span></button>';
      }).join('') + '</div><div id="after"></div>'));
    var cards = Array.prototype.slice.call(stage.querySelectorAll('.flip'));
    cards.forEach(function (c, k) {
      c.onclick = function () {
        cards.forEach(function (x) { x.disabled = true; });
        c.classList.add('open');
        state.prize = CONFIG.prizes[order[k]];
        setTimeout(function () {
          cards.forEach(function (x) { if (x !== c) { x.classList.add('open', 'dim'); } });
        }, 900);
        setTimeout(function () { after(i, 'Карта выбрана. Приз уже лежит в твоих купонах.'); }, 1900);
      };
    });
  }

  /* Подсчёт */
  function calc() {
    mount('<section class="ticket enter"><div class="stub"><span>Обработка</span><span>идёт</span></div>' +
      '<h2 class="q">Считаю результат</h2><p class="hint" id="step">Сверяю ответы с базой всех пар мира…</p>' +
      '<div class="dots"><i></i><i></i><i></i></div></section>');
    var step = $('step');
    setProgress(90);
    setTimeout(function () { step.textContent = 'Проверяю совместимость по гороскопу…'; setProgress(94); }, 1400);
    setTimeout(function () { step.textContent = 'Считаю, сколько в тебе любви…'; setProgress(97); }, 2800);
    setTimeout(function () { step.textContent = 'Подожди, шкала зашкаливает…'; setProgress(99); }, 4200);
    setTimeout(function () { step.textContent = 'Готово. Даже не верится.'; setProgress(100); }, 6600);
    setTimeout(result, 7800);
  }

  /* Результат и купоны */
  function result() {
    var t = state.tally;
    var key = ['a', 'b', 'c'].sort(function (x, y) { return t[y] - t[x]; })[0];
    var type = TYPES[key];
    var rows = [
      ['Уровень нежности', 92 + Math.min(6, t.a * 2)],
      ['Уровень безумия', 88 + Math.min(10, t.b * 3)],
      ['Совместимость по мемам', 90 + Math.min(9, t.c * 3)]
    ];
    var coupons = CONFIG.coupons.slice();
    if (state.prize) coupons.push(state.prize.full);

    mount(
      '<section class="ticket enter"><div class="stub"><span>Результат теста</span><span>готово</span></div>' +
      '<p class="eyebrow">Ваш тип пары, ' + esc(nm()) + '</p>' +
      '<h2 class="q big">' + esc(type.title) + '</h2><p class="desc">' + esc(type.desc) + '</p>' +
      '<div class="meters">' + rows.map(function (r) {
        return '<div class="mrow"><div class="mrow-top"><span>' + r[0] + '</span><b>' + r[1] + '%</b></div><div class="track"><div class="mfill" data-w="' + r[1] + '"></div></div></div>';
      }).join('') + '</div>' +
      '<p class="total">Общая совместимость: 100%. Шкала сломалась, пришлось выдать больше.</p></section>' +
      '<section class="ticket enter"><div class="stub"><span>Твои купоны</span><span>' + coupons.length + ' шт.</span></div>' +
      '<p class="hint" style="margin-top:0">Нажми на купон, чтобы активировать. Предъявлять лично.</p>' +
      coupons.map(function (c) {
        return '<div class="coupon"><span class="ct">' + esc(c) + '</span><button class="btn ghost">Активировать</button></div>';
      }).join('') +
      '<button class="btn primary" id="last" style="margin-top:20px">К последнему вопросу</button></section>'
    );
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        Array.prototype.forEach.call(stage.querySelectorAll('.mfill'), function (m) { m.style.width = m.dataset.w + '%'; });
      });
    });
    Array.prototype.forEach.call(stage.querySelectorAll('.coupon .btn'), function (b) {
      b.onclick = function () {
        b.parentNode.classList.add('used');
        b.textContent = 'Активирован';
        b.disabled = true;
      };
    });
    $('last').onclick = finalQuestion;
  }

  function finalQuestion() {
    duel({
      q: CONFIG.finalQuestion, yes: 'Да',
      nos: ['Нет', 'Подумай ещё', 'Я приготовлю ужин', 'Там будет десерт', 'Ну пожалуйста', 'Я угощаю'],
      cap: 'Последний вопрос. Честно.', gone: 'Кнопка «Нет» ушла в отпуск. Остался один вариант.',
      html: function (inner) { return ticket('Последний вопрос', 'Финал', 'ответь', inner); },
      onYes: ending
    });
  }

  function heartPath(ctx, x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y - s * 0.2, x - s * 0.6, y - s * 0.2, x - s * 0.6, y + s * 0.15);
    ctx.bezierCurveTo(x - s * 0.6, y + s * 0.5, x - s * 0.2, y + s * 0.7, x, y + s * 0.95);
    ctx.bezierCurveTo(x + s * 0.2, y + s * 0.7, x + s * 0.6, y + s * 0.5, x + s * 0.6, y + s * 0.15);
    ctx.bezierCurveTo(x + s * 0.6, y - s * 0.2, x, y - s * 0.2, x, y + s * 0.3);
    ctx.fill();
  }

  function confetti() {
    if (reduce) return;
    var c = $('fx'), ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
    var W = window.innerWidth, H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.scale(dpr, dpr);
    var cs = getComputedStyle(document.documentElement);
    var cols = [cs.getPropertyValue('--accent').trim(), cs.getPropertyValue('--sun').trim(), cs.getPropertyValue('--fg').trim()];
    var ps = [];
    for (var k = 0; k < 110; k++) {
      ps.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
        s: 10 + Math.random() * 14, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.15, c: cols[Math.floor(Math.random() * cols.length)] });
    }
    var t0 = performance.now();
    function frame(t) {
      ctx.clearRect(0, 0, W, H);
      ps.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r * 0.2); ctx.fillStyle = p.c; heartPath(ctx, 0, 0, p.s); ctx.restore();
      });
      if (t - t0 < 5000) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(frame);
  }

  function ending() {
    confetti();
    mount('<section class="ticket enter"><div class="stub"><span>Ответ принят</span><span>финал</span></div>' +
      '<h2 class="q big">Договорились, ' + esc(nm()) + '.</h2><div class="letter" style="margin-top:16px">' +
      CONFIG.letter.map(function (p) { return '<p>' + esc(fillName(p)) + '</p>'; }).join('') + '</div>' +
      (state.secret ? '<div class="secret"><b>Секретная концовка</b><p>' + esc(CONFIG.secretLine) + '</p></div>' : '') +
      '<p class="hint">Сделай скриншот этого экрана и отправь мне. Это твой билет.</p>' +
      '<button class="btn ghost" id="again">Пройти заново</button></section>');
    $('again').onclick = intro;
  }

  intro();
})();
</script>

</body></html>
